<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Support</title>
  <div class="container">
    <img src="https://media3.giphy.com/media/avvVmC2CiO4QUXP9L5/200.gif" alt="Your GIF" class="centered-gif">
  </div>
  <style>
    body {
      background-color: #800909; /* Light red background */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      max-width: 600px;
      margin: 50px auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      height: 80vh;
    }

    .chat-box {
      width: 100%;
      height: 80%;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 10px;
      max-width: 80%;
    }

    .user-message {
      background-color: #d4f5e9;
      align-self: flex-start;
    }

    .support-message {
      background-color: #e1e1e1;
      align-self: flex-end;
    }

    .input-container {
      display: flex;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
    }

    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- Chat messages will appear here -->
    </div>

    <div class="input-container">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

    <a href="index.html" class="back-btn">Go Back</a>
  </div>

  <script>
    function sendMessage() {
      const inputField = document.getElementById('user-input');
      const userMessage = inputField.value.trim();

      if (userMessage) {
        // Display user message
        displayMessage(userMessage, 'user-message');
        inputField.value = ''; // Clear input field

        // Simulate support response
        setTimeout(() => {
          const supportMessage = "Thank you for reaching out! How can I assist you?";
          displayMessage(supportMessage, 'support-message');
        }, 1000); // Support message will appear after 1 second
      }
    }

    function displayMessage(message, className) {
      const chatBox = document.getElementById('chat-box');
      const messageElement = document.createElement('div');
      messageElement.classList.add('message', className);
      messageElement.textContent = message;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the latest message
    }
  </script>

</body>
</html>
